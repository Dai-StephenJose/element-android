name: Build and release nightly APK
on:
  workflow_dispatch:
  schedule:
    # Every nights at 4
    - cron: "0 4 * * *"
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g" -Dkotlin.incremental=false -XX:+UseG1GC
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -PpreDexEnable=false --max-workers 2 --no-daemon

jobs:
  nightly:
    name: Build nightly APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
          
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          
      - name: Install towncrier
        run: |
          python3 -m pip install towncrier
          
      - name: Prepare changelog file
        run: |
          mv towncrier.toml towncrier.toml.bak
          sed 's/CHANGES\.md/CHANGES_NIGHTLY\.md/' towncrier.toml.bak > towncrier.toml
          rm towncrier.toml.bak
          yes n | towncrier build --version nightly
          
      # 🔑 动态生成签名证书
      - name: Generate signing certificate
        run: |
          # 创建密钥库目录
          mkdir -p vector-app/signature
          
          echo "🔑 Creating keystore with robust error handling..."
          
          # 使用文件方式处理特殊字符
          cat > /tmp/keystore_pass.txt << 'EOL'
          ${{ secrets.KEYSTORE_PASSWORD }}
          EOL
          
          cat > /tmp/key_pass.txt << 'EOL'
          ${{ secrets.KEY_PASSWORD }}
          EOL
          
          # 读取密码到变量
          KEYSTORE_PASS=$(cat /tmp/keystore_pass.txt)
          KEY_PASS=$(cat /tmp/key_pass.txt)
          
          echo "Password lengths - Keystore: ${#KEYSTORE_PASS}, Key: ${#KEY_PASS}"
          
          # 确保密钥库文件不存在
          rm -f vector-app/signature/nightly.keystore
          
          # 生成密钥库文件
          echo "🔨 Generating keystore..."
          keytool -genkey \
            -v \
            -keystore vector-app/signature/nightly.keystore \
            -alias nightly \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storepass "${KEYSTORE_PASS}" \
            -keypass "${KEY_PASS}" \
            -dname "CN=${{ secrets.CERT_CN || 'YourApp' }}, OU=${{ secrets.CERT_OU || 'Development' }}, O=${{ secrets.CERT_O || 'YourCompany' }}, L=${{ secrets.CERT_L || 'City' }}, ST=${{ secrets.CERT_ST || 'State' }}, C=${{ secrets.CERT_C || 'US' }}" \
            -noprompt
          
          # 检查文件是否创建成功
          if [ -f vector-app/signature/nightly.keystore ]; then
            echo "✅ Keystore file created successfully"
            ls -la vector-app/signature/nightly.keystore
          else
            echo "❌ Keystore file was not created!"
            exit 1
          fi
          
          # 等待一下确保文件完全写入
          sleep 2
          
          # 验证密钥库（分两步进行）
          echo "🔍 Step 1: Basic keystore verification..."
          keytool -list -keystore vector-app/signature/nightly.keystore -storepass "${KEYSTORE_PASS}" -rfc | head -5
          
          echo "🔍 Step 2: Detailed verification..."
          keytool -list -v -keystore vector-app/signature/nightly.keystore -storepass "${KEYSTORE_PASS}" | head -10
          
          echo "✅ Keystore verification completed successfully"
          
          # 设置环境变量供后续步骤使用
          echo "ELEMENT_ANDROID_NIGHTLY_STOREPASSWORD=${KEYSTORE_PASS}" >> $GITHUB_ENV
          echo "ELEMENT_ANDROID_NIGHTLY_KEYPASSWORD=${KEY_PASS}" >> $GITHUB_ENV
          echo "ELEMENT_ANDROID_NIGHTLY_KEYID=nightly" >> $GITHUB_ENV
          
          echo "🎯 Environment variables set successfully"
          
          # 清理临时文件
          rm -f /tmp/keystore_pass.txt /tmp/key_pass.txt
          
      # 🔍 调试签名配置
      - name: Debug signing configuration
        run: |
          echo "🔍 验证签名配置..."
          
          # 使用文件方式安全读取密码
          cat > /tmp/debug_keystore_pass.txt << 'EOL'
          ${{ env.ELEMENT_ANDROID_NIGHTLY_STOREPASSWORD }}
          EOL
          
          KEYSTORE_PASS=$(cat /tmp/debug_keystore_pass.txt)
          
          # 检查密钥库文件
          echo "Keystore file info:"
          ls -la vector-app/signature/nightly.keystore
          file vector-app/signature/nightly.keystore
          
          # 测试密钥库访问
          echo "Testing keystore access:"
          keytool -list -keystore vector-app/signature/nightly.keystore -storepass "${KEYSTORE_PASS}" -alias nightly
          
          # 验证环境变量（不显示实际密码）
          echo "Environment variables:"
          echo "ELEMENT_ANDROID_NIGHTLY_KEYID: ${ELEMENT_ANDROID_NIGHTLY_KEYID:-NOT_SET}"
          echo "ELEMENT_ANDROID_NIGHTLY_KEYPASSWORD: ${ELEMENT_ANDROID_NIGHTLY_KEYPASSWORD:+SET(${#ELEMENT_ANDROID_NIGHTLY_KEYPASSWORD} chars)}"
          echo "ELEMENT_ANDROID_NIGHTLY_STOREPASSWORD: ${ELEMENT_ANDROID_NIGHTLY_STOREPASSWORD:+SET(${#ELEMENT_ANDROID_NIGHTLY_STOREPASSWORD} chars)}"
          
          # 检查 Gradle 是否能识别签名配置
          echo "Testing Gradle signing config:"
          ./gradlew :vector-app:signingReport --configuration nightly || echo "Warning: signingReport failed, but continuing..."
          
          # 清理临时文件
          rm -f /tmp/debug_keystore_pass.txt
          
      # 📱 构建 APK
      - name: Build Gplay Nightly APK
        run: |
          echo "🚀 Building APK..."
          
          # 验证环境变量（不显示实际密码）
          echo "Environment variables check:"
          echo "KEYID: ${ELEMENT_ANDROID_NIGHTLY_KEYID}"
          echo "KEYPASSWORD length: ${#ELEMENT_ANDROID_NIGHTLY_KEYPASSWORD}"
          echo "STOREPASSWORD length: ${#ELEMENT_ANDROID_NIGHTLY_STOREPASSWORD}"
          
          # 验证密钥库文件
          echo "🔍 Verifying keystore before build..."
          ls -la vector-app/signature/nightly.keystore
          
          # 构建 APK
          ./gradlew assembleGplayNightly $CI_GRADLE_ARG_PROPERTIES
          
          echo "✅ APK 构建完成！"
          echo "📋 构建文件信息："
          find . -name "*.apk" -type f | head -10
          
      # 📤 上传 APK 作为 Artifact
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-apk-${{ github.run_number }}
          path: |
            **/*.apk
          retention-days: 30
          
      # 📋 输出签名信息
      - name: Display signing info
        if: success()
        run: |
          echo "✅ APK 构建和签名成功!"
          echo "📋 签名信息:"
          
          # 使用文件方式安全读取密码
          cat > /tmp/final_keystore_pass.txt << 'EOL'
          ${{ env.ELEMENT_ANDROID_NIGHTLY_STOREPASSWORD }}
          EOL
          
          KEYSTORE_PASS=$(cat /tmp/final_keystore_pass.txt)
          keytool -list -v -keystore vector-app/signature/nightly.keystore -storepass "${KEYSTORE_PASS}" | head -20
          
          echo "📦 APK 文件已上传为 GitHub Artifact，可以在 Actions 页面下载"
          
          # 清理临时文件
          rm -f /tmp/final_keystore_pass.txt
          
      # 🗑️ 清理敏感文件
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f vector-app/signature/nightly.keystore
          echo "🧹 密钥库文件已清理"